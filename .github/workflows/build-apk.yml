name: Build APK

on:
  push:
    branches: [ main, master ]
  release:
    # 'published' fires exactly once whether a release is created directly or
    # a draft is later published; 'created' missed the draft->publish path
    # entirely, which left V1.8.10 with no build and no APK (entry #43).
    # Do NOT list both types: a direct create emits created AND published,
    # and both would trigger -- double builds, double attach.
    types: [ published ]
  workflow_dispatch: {}

permissions:
  contents: write # needed to attach the APK to a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # When this build was triggered by publishing a GitHub Release, derive the
      # app's version name from the release tag (e.g. tag "v1.5" or "V1.5" ->
      # versionName "1.5"), and use the Actions run number as the version code, which always
      # increases regardless of tag naming. Plain pushes/manual runs keep the
      # defaults baked into build.gradle.kts.
      - name: Determine version override
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            VERSION_NAME="${TAG#[vV]}"
            echo "gradle_args=-PversionNameOverride=$VERSION_NAME -PversionCodeOverride=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "gradle_args=" >> "$GITHUB_OUTPUT"
          fi

      # Release variant (non-debuggable) -- Compose scroll performance in
      # debuggable builds is drastically worse; see PROJECT_NOTES entry #17.
      # Signed with the same committed keystore as debug, so it installs over
      # older debug-signed installs without an uninstall.
      # Decode the release signing key from repository secrets. Deliberately not
      # gated on an `if:` expression -- the shell check keeps this working when the
      # secret is absent (a fork, or before the key was set up), in which case the
      # build falls back to the committed debug key rather than failing. The value
      # is never echoed; whitespace is stripped in case the base64 was pasted
      # wrapped. See PROJECT_NOTES, "THE REPO IS PUBLIC".
      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Release keystore decoded ($(stat -c%s "$RUNNER_TEMP/release.keystore") bytes)"
          else
            echo "No KEYSTORE_B64 secret set; falling back to debug signing"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease ${{ steps.version.outputs.gradle_args }}

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlarmClock-apk
          path: app/build/outputs/apk/release/app-release.apk

      # Only runs when this build was triggered by publishing a GitHub Release.
      # Attaches a version-named APK directly to that release as a downloadable asset.
      - name: Rename APK for release
        if: github.event_name == 'release'
        run: cp app/build/outputs/apk/release/app-release.apk AlarmClock-${{ github.event.release.tag_name }}.apk

      - name: Attach APK to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: AlarmClock-${{ github.event.release.tag_name }}.apk
